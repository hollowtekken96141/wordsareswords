<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swords2</title>
    <link rel="preload" href="./fonts/Mom.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/AmericanLights.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./images/background-poster.webp" as="image">
    <style>
        @font-face {
            font-family: 'AmericanLights';
            src: url('./fonts/AmericanLights.woff2') format('woff2');
            font-display: swap;
        }

        @font-face {
            font-family: 'Mom';
            src: url('./fonts/Mom.woff2') format('woff2');
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Mom', sans-serif;
            color: #ffffff;
            background-color: #000000;
            touch-action: none;
            overscroll-behavior: none;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: cover;
            object-position: center;
        }

        /* Safari draws a play glyph over a video it refused to autoplay; hide it. */
        video::-webkit-media-controls-start-playback-button,
        video::-webkit-media-controls {
            display: none !important;
            -webkit-appearance: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .logo {
            position: absolute;
            top: 10px;
            right: 20px;
            z-index: 20;
        }

        .logo img {
            max-width: 250px;
            height: auto;
            display: block;
        }

        .content {
            padding: 5vw;
            padding-top: 110px;
            text-align: left;
            overflow-y: auto;
            max-height: calc(100vh - 110px);
        }

        h1 {
            font-family: 'AmericanLights', sans-serif;
            font-size: clamp(45px, 15vw, 55px);
            color: #ffffff;
            margin-bottom: 40px;
            font-weight: normal;
        }

        .info-section {
            font-family: 'Mom', sans-serif;
            font-size: clamp(14px, 3vw, 18px);
            line-height: 2;
            color: #ffffff;
        }

        .info-section p {
            display: block;
            width: fit-content;
            position: relative;
            padding: 8px 14px;
            margin-bottom: 20px;
            will-change: transform;
            transform-origin: 50% 50%;
            transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg));
            animation: intro-wiggle 0.5s ease-in-out;
            animation-delay: calc(300ms + var(--i, 0) * 70ms);
            -webkit-user-select: none;
            user-select: none;
        }

        @keyframes intro-wiggle {
            0%   { transform: translate(0, 0) rotate(0deg); }
            25%  { transform: translate(-3px, 1px) rotate(-2.5deg); }
            50%  { transform: translate(3px, -1px) rotate(2deg); }
            75%  { transform: translate(-2px, 0) rotate(-1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .info-section p {
                animation: none;
                transform: none;
            }
        }

        .info-section p::before {
            content: '';
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: 0;
            right: 0;
            background-image: url('./images/highlight.webp');
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-position: center left;
            z-index: -1;
        }

        h1 a {
            text-decoration: none;
        }

        a {
            color: #00ff04;
            text-decoration: underline;
            cursor: pointer;
            -webkit-touch-callout: none;
        }

        a:hover {
            color: #cccccc;
        }

        @media (max-width: 768px) {
            .logo {
                position: fixed;
                top: 50vh;
                left: -25vw;
                right: auto;
                width: 150%;
                height: 20%;
                z-index: 2;
            }

            .logo img {
                width: 100%;
                height: 300%;
                max-width: none;
                object-fit: fill;
            }

            body {
                position: fixed;
                inset: 0;
            }

            .content {
                padding-top: 20px;
                max-height: none;
                overflow: hidden;
                z-index: 5;
            }
        }

    </style>
</head>
<body>
    <video class="background" autoplay muted loop playsinline preload="auto"
           poster="./images/background-poster.webp" aria-hidden="true">
        <source src="./images/background.webm" type="video/webm">
        <source src="./images/background.mp4" type="video/mp4">
    </video>
    
    <div class="container">
        <div class="logo">
            <img src="./images/logo.gif" alt="Logo" width="468" height="468" fetchpriority="high">
        </div>

        <div class="content">
            <h1><a href="https://instagram.com/2swords2" target="_blank" rel="noopener noreferrer">Swords2</a></h1>
            
            <div class="info-section">
                <p>-   For booking and other inquiries email - <a href="mailto:truestblank@gmail.com">truestblank@gmail.com</a></p>
                
                <p><a href="https://youtube.com/@swords7/videos" target="_blank" rel="noopener noreferrer">-  music videos</a></p>
                
                <p><a href="https://soundcloud.com/swords2" target="_blank" rel="noopener noreferrer">-  soundcloud</a></p>
                
                <p><a href="https://open.spotify.com/artist/6r3hk2gxKo56hw8sFpeUKA" target="_blank" rel="noopener noreferrer">-  spotify</a></p>
                
                <p><a href="https://music.apple.com/us/artist/swords2/1588060878" target="_blank" rel="noopener noreferrer">-  apple music</a></p>
                
                <p><a href="https://lecitadell.com" target="_blank" rel="noopener noreferrer">-  le citadell</a></p>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // Background: try the video first. If the browser refuses to play it
            // (e.g. iOS Low Power Mode blocks autoplay), swap in an animated WebP,
            // which browsers always animate. Otherwise retry play() on first touch.
            var video = document.querySelector('video.background');
            var swapped = false;
            function useAnimatedImage() {
                if (swapped || !video) return;
                swapped = true;
                var img = document.createElement('img');
                img.className = 'background';
                img.src = './images/background.webp';
                img.alt = '';
                img.setAttribute('aria-hidden', 'true');
                video.replaceWith(img);
                video = null;
            }
            function playVideo() {
                if (!video || !video.paused) return;
                var p = video.play();
                if (p && p.catch) p.catch(useAnimatedImage);
            }
            playVideo();
            window.addEventListener('pointerdown', playVideo);

            var blocks = Array.prototype.slice.call(document.querySelectorAll('.info-section p'));
            if (!blocks.length) return;

            // Stagger the intro wiggle row by row.
            blocks.forEach(function (b, i) { b.style.setProperty('--i', i); });

            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            var HOLD_DELAY = 160;  // ms a press must last before it counts as a hold
            var MAX_SHIFT  = 6;    // px
            var MAX_ROT    = 3;    // deg
            var FREQ       = 14;   // Hz

            var pointer = { x: 0, y: 0 };
            var centers = [];
            var range = 1;
            var phases = blocks.map(function (_, i) { return i * 1.7; });
            var holdTimer = null;
            var raf = null;
            var active = false;
            var intensity = 0;
            var exempt = null;
            var holdType = '';

            function measure() {
                centers = blocks.map(function (b) {
                    var r = b.getBoundingClientRect();
                    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
                });
                range = Math.hypot(window.innerWidth, window.innerHeight);
            }

            function rest(b) {
                b.style.setProperty('--dx', '0px');
                b.style.setProperty('--dy', '0px');
                b.style.setProperty('--rot', '0deg');
            }

            function frame(now) {
                var t = now / 1000;
                intensity += ((active ? 1 : 0) - intensity) * (active ? 0.25 : 0.15);
                if (!active && intensity < 0.01) {
                    intensity = 0;
                    blocks.forEach(rest);
                    raf = null;
                    return;
                }
                blocks.forEach(function (b, i) {
                    if (b === exempt) { rest(b); return; }
                    var c = centers[i];
                    var d = Math.hypot(pointer.x - c.x, pointer.y - c.y);
                    var amp = Math.max(0, 1 - d / range);   // closer = stronger, linear falloff
                    amp = amp * intensity;
                    var w = t * FREQ * Math.PI * 2 + phases[i];
                    b.style.setProperty('--dx', (Math.sin(w) * MAX_SHIFT * amp).toFixed(2) + 'px');
                    b.style.setProperty('--dy', (Math.cos(w * 1.3 + 1) * MAX_SHIFT * 0.6 * amp).toFixed(2) + 'px');
                    b.style.setProperty('--rot', (Math.sin(w * 0.8 + 2) * MAX_ROT * amp).toFixed(2) + 'deg');
                });
                raf = requestAnimationFrame(frame);
            }

            function startHold() {
                holdTimer = null;
                measure();
                active = true;
                if (!raf) raf = requestAnimationFrame(frame);
            }

            function onDown(e) {
                if (e.button !== 0 || !e.isPrimary) return;
                pointer.x = e.clientX;
                pointer.y = e.clientY;
                holdType = e.pointerType;
                var a = e.target.closest ? e.target.closest('a') : null;
                exempt = a ? a.closest('.info-section p') : null;
                clearTimeout(holdTimer);
                holdTimer = setTimeout(startHold, HOLD_DELAY);
            }

            function onMove(e) {
                if (!e.isPrimary) return;
                pointer.x = e.clientX;
                pointer.y = e.clientY;
            }

            function onUp() {
                clearTimeout(holdTimer);
                holdTimer = null;
                active = false;
                holdType = '';
            }

            window.addEventListener('pointerdown', onDown);
            window.addEventListener('pointermove', onMove, { passive: true });
            window.addEventListener('pointerup', onUp);
            window.addEventListener('pointercancel', onUp);
            window.addEventListener('blur', onUp);
            window.addEventListener('resize', function () { if (active) measure(); });
            document.addEventListener('contextmenu', function (e) {
                if (holdType === 'touch') e.preventDefault();
            });
        })();
    </script>
</body>
</html>
